sujet:
  id: dictionnaire-marchands
  titre: Dictionnaire de marchands versionné et mémorisation « pour ce marchand »
  lot: L75
  perimetre:
    modules:
      - backend/src/modules/category-rules
      - backend/src/modules/analysis
      - backend/src/modules/auto-categorize
      - backend/src/modules/statements
    endpoints:
      - "PATCH /api/statements/:id/transactions/:txId/category"
      - "POST /api/auto-categorize/:statementId/preview"
      - "POST /api/statements/upload"
      - "POST /api/statements/:id/reanalyze"
    jobs: []
    hors_perimetre:
      - "la case à cocher et son affichage dans le frontend (partie écran du lot, à part)"
      - "l'édition du dictionnaire par l'utilisateur (le dictionnaire est livré avec le code)"
      - "la catégorisation par Claude lors de l'extraction du PDF (inchangée)"

cas:
  - id: C1
    titre: Un relevé analysé ou ré-analysé reçoit les catégories du dictionnaire
    acteur: un client de l'API (l'utilisateur qui dépose un PDF)
    declencheur: POST /api/statements/upload
    preconditions:
      - Claude a extrait les transactions et leur a donné une catégorie
      - le dictionnaire de marchands livré avec le code est chargé
    nominal:
      - Le service construit le relevé depuis la réponse de Claude.
      - Les règles utilisateur sont appliquées comme aujourd'hui, avec en plus la liste des transactions reconnues par une règle (CategoryRulesService.applyWithHits, R19).
      - Pour chaque débit qu'aucune règle utilisateur n'a reconnu (suivi par applyWithHits, R19), le libellé est normalisé puis comparé au dictionnaire.
      - Si une enseigne est reconnue, la catégorie du dictionnaire remplace celle de Claude.
      - Le service écrit un log avec la version du dictionnaire et le nombre de transactions recatégorisées, puis poursuit (revenu exceptionnel, sauvegarde, auto-sync).
    alternatives:
      - { si: une règle utilisateur correspond au libellé, alors: la règle gagne et le dictionnaire n'est pas consulté pour cette transaction, regles: [R7] }
      - { si: la transaction est un crédit (montant positif), alors: elle n'est pas recatégorisée par le dictionnaire, regles: [R8] }
      - { si: aucune enseigne du dictionnaire n'est reconnue, alors: la catégorie de Claude est conservée, regles: [R4] }
      - { si: le relevé est ré-analysé (POST /api/statements/:id/reanalyze), alors: même passage dictionnaire que l'analyse, regles: [R6] }
    resultat: Les enseignes connues ont la même catégorie d'un mois à l'autre, sans dépendre de la réponse de Claude.
  - id: C2
    titre: L'auto-catégorisation résout les enseignes connues sans appeler Claude
    acteur: un client de l'API
    declencheur: POST /api/auto-categorize/:statementId/preview
    preconditions:
      - le relevé existe et l'instance n'est pas en mode démo
      - le relevé contient des transactions en catégorie other
    nominal:
      - Le service isole les transactions other.
      - Il normalise chaque libellé et le compare au dictionnaire.
      - Les transactions reconnues deviennent des suggestions de confiance 1, source dictionary, sans appel à Claude.
      - Seules les transactions restantes partent à Claude par lots.
      - La réponse mêle suggestions dictionary et claude, triées par confiance décroissante ; rien n'est modifié.
    alternatives:
      - { si: toutes les transactions other sont reconnues, alors: aucun appel à Claude n'est fait, regles: [R10] }
      - { si: aucune n'est reconnue, alors: le comportement actuel est inchangé, regles: [R11] }
      - { si: le mode démo est actif, alors: l'appel est refusé avant tout traitement, regles: [R12] }
    resultat: Moins de tokens consommés, suggestions des enseignes connues sûres et immédiates.
  - id: C3
    titre: L'utilisateur recatégorise une transaction et mémorise le marchand
    acteur: l'utilisateur, via le frontend
    declencheur: PATCH /api/statements/:id/transactions/:txId/category
    preconditions:
      - le relevé et la transaction existent
      - le corps porte une catégorie valide et memorizeMerchant à true
    nominal:
      - Le service applique la catégorie à la transaction et sauvegarde le relevé.
      - Il détermine les mots du motif (R15) : ceux de l'enseigne que le dictionnaire reconnaît dans le libellé, sinon la clé de marchand entière.
      - Il crée une règle utilisateur (priorité 100, ou supérieure à celle des règles qui reconnaissent déjà le libellé, R13) dont le motif cible cette clé ; aucune règle existante n'est modifiée.
      - Si replayAll est vrai, la règle est rejouée sur tous les relevés stockés.
      - La réponse renvoie la transaction, la règle créée et le nombre de relevés rejoués.
    alternatives:
      - { si: memorizeMerchant est absent ou différent du booléen true, alors: comportement actuel inchangé (createRule, rulePattern, replayAll), regles: [R16] }
      - { si: createRule est aussi vrai, alors: le chemin createRule existant gagne, regles: [R16] }
      - { si: le libellé ne laisse aucun mot après normalisation, alors: la catégorie est appliquée mais aucune règle n'est créée, regles: [R14] }
      - { si: le motif du marchand ne correspond pas au libellé brut de la transaction, alors: la catégorie est appliquée mais aucune règle n'est créée, regles: [R15] }
      - { si: le motif se réduit à un seul mot de moins de 4 lettres, alors: la catégorie est appliquée mais aucune règle n'est créée (pattern-too-short), regles: [R15] }
      - { si: la règle qui gagne déjà sur ce libellé donne la catégorie et la sous-catégorie choisies, alors: elle est réutilisée, rien n'est écrit, regles: [R13] }
      - { si: une règle existante reconnaît le libellé avec un autre résultat, alors: une nouvelle règle de priorité supérieure est créée, l'ancienne reste intacte, regles: [R13] }
      - { si: la catégorie est invalide, ou le relevé ou la transaction est introuvable, alors: erreur existante, rien n'est écrit, regles: [R17] }
    resultat: La catégorie est corrigée et mémorisée pour les prochains relevés en un seul appel.

regles:
  - id: R1
    cas: [C1, C2, C3]
    enonce: >-
      Normalisation d'un libellé (clé de marchand) : mise en majuscules, accents retirés, retrait des préfixes
      bancaires (CB, PAIEMENT CB, ACHAT CB, CARTE, PRELEVEMENT et abréviations), des dates (jj/mm, jj/mm/aa) et de tout mot
      contenant un chiffre, espaces réduits. La clé est calculée à la volée ; description et normalizedDescription stockées ne sont jamais réécrites. La clé est aussi calculée par un miroir frontend (frontend/src/lib/merchant-key.ts) pour nommer le marchand dans le panneau Catégoriser : un test de parité exécute les deux sur un même jeu de libellés et compare les deux dictionnaires ; toute évolution de la clé (R2, R18) ou du dictionnaire (R3, R4) se fait des deux côtés.
    statut: sourcee
    source: "demande du lot : « normalisation des libellés LBP (CB, PRELEVEMENT, numéros, dates) » ; normalizedDescription lu tel quel par apply, category-rules.service.ts:140"
    tests:
      - "R1 — « PAIEMENT CB 1203 CARREFOUR MARKET 75015 12/03 » donne la clé « CARREFOUR MARKET »"
      - "R1 — les champs description et normalizedDescription de la transaction sont identiques avant et après le passage"
      - "R1 — « %s » donne la même clé et les mêmes mots (parité backend / miroir frontend sur un même jeu de libellés)"
  - id: R2
    cas: [C1, C2, C3]
    enonce: >-
      Liste des préfixes retirés : CB, PAIEMENT CB, ACHAT CB, CARTE, CARTE X + chiffres, PRELEVEMENT, PRELEVT, PRLV,
      VIR, VIREMENT. Un libellé réduit à ces seuls mots a une clé vide.
    statut: hypothese
    si_faux: Si LBP emploie d'autres préfixes (exemples réels non disponibles dans le dépôt, aucune vraie transaction versionnée), la clé garde ce mot en tête ; il suffit d'allonger la liste, aucune donnée en jeu.
    tests:
      - "R2 — chaque préfixe de la liste est retiré en tête de libellé"
      - "R2 — « CB 1234 » donne une clé vide"
  - id: R3
    cas: [C1, C2]
    enonce: >-
      Le dictionnaire est livré avec le code, sans stockage utilisateur. Contenu initial : Carrefour, Leclerc, Lidl → food ;
      SNCF, TotalEnergies, Vinci, Uber → transport ; Netflix, Free, Orange → subscriptions. Les catégories sont
      les identifiants intégrés (BUILTIN_CATEGORIES), jamais un libellé affiché.
    statut: sourcee
    source: "demande du lot : « Carrefour/Leclerc/Lidl → Alimentation, SNCF/TotalEnergies/Vinci/Uber → Transport, Netflix/Free/Orange → Abonnements » ; identifiants food, transport, subscriptions : category-rules.service.ts:15-18"
    tests:
      - "R3 — chacune des dix enseignes du lot est reconnue avec sa catégorie"
      - "R3 — toutes les catégories du dictionnaire appartiennent aux catégories intégrées"
  - id: R4
    cas: [C1, C2]
    enonce: >-
      Une enseigne est reconnue quand ses mots forment une suite de mots entiers de la clé, quelle que soit la position ;
      en cas de plusieurs entrées possibles, la plus longue gagne. « FREE » ne reconnaît donc pas « FREEDOM », et une entrée plus
      précise (UBER EATS) l'emporte sur UBER. Exception livrée (commit ce2d6c4) : une entrée peut porter des mots d'exclusion
      (champ unless du code) qui, présents n'importe où dans la clé, l'écartent : un organisme de crédit ou d'épargne homonyme
      n'est pas une dépense de l'enseigne. Carrefour et Orange sont écartés par BANQUE, BANK, FINANCE, FINANCEMENT, LIVRET, CREDIT,
      ASSURANCE, PRET (« CARREFOUR BANQUE » reste un crédit) ; Free l'est par DUTY (« DUTY FREE »).
    statut: hypothese
    si_faux: Si la correspondance doit être « contient » plutôt que mots entiers, des libellés voisins seraient classés à tort (FREE dans un nom de commerçant) ; seul le comparateur change.
    tests:
      - "R4 — « FREEDOM SPORT » n'est pas reconnu comme Free"
      - "R4 — « UBER EATS PARIS » est reconnu par l'entrée UBER EATS, pas par UBER"
      - "R4 — une enseigne inconnue laisse la catégorie de Claude intacte"
  - id: R5
    cas: [C1, C2]
    enonce: Le dictionnaire contient aussi UBER EATS → food, entrée plus précise que UBER → transport.
    statut: hypothese
    si_faux: Si Sylvain veut Uber Eats en transport, une seule entrée est à retirer ; aucune donnée en jeu.
    tests:
      - "R5 — UBER EATS donne food"
  - id: R6
    cas: [C1]
    enonce: >-
      Le dictionnaire porte un numéro de version entier (constante du code, 1 au départ). Chaque application dans une analyse
      ou une ré-analyse écrit un log « Merchant dictionary v<version>: <n> transaction(s) recategorized » ; la version n'est
      pas écrite dans les relevés.
    statut: hypothese
    si_faux: Si la version doit être stockée par transaction ou par relevé (pour recatégoriser au changement de version), c'est un changement de modèle des relevés, à décider par le lead ; ici seul le log change.
    tests:
      - "R6 — le log contient la version et le nombre exact de transactions recatégorisées"
      - "R6 — le relevé sauvegardé ne contient aucun champ de version"
  - id: R7
    cas: [C1]
    enonce: >-
      Priorité : règle utilisateur > dictionnaire > catégorie de Claude. Une transaction reconnue par une règle utilisateur
      (matchedIds, R19) ne passe pas par le dictionnaire.
    statut: sourcee
    source: "règles utilisateur appliquées par priorité, première gagnante : category-rules.service.ts:119-149 ; demande du lot : dictionnaire « appliqué en local avant Claude »"
    tests:
      - "R7 — une règle utilisateur sur CARREFOUR vers other l'emporte sur le dictionnaire"
      - "R7 — sans règle, le dictionnaire l'emporte sur la catégorie de Claude"
  - id: R8
    cas: [C1, C2]
    enonce: Le dictionnaire ne s'applique qu'aux débits (montant strictement négatif) ; un crédit (remboursement, virement reçu) garde sa catégorie.
    statut: hypothese
    si_faux: Si un remboursement Carrefour doit aussi être classé food, les crédits changent de catégorie, ce qui touche les calculs de revenu (income) ; à rouvrir avec l'impact score/santé.
    tests:
      - "R8 — un crédit « CARREFOUR » à +20 € garde sa catégorie"
      - "R8 — un débit « CARREFOUR » à -20 € passe en food"
  - id: R9
    cas: [C1]
    enonce: >-
      CategoryRulesService.replayAll (replay-all, « créer une règle + rejouer », auto-catégorisation par lot) n'applique jamais
      le dictionnaire : seules les règles utilisateur sont rejouées, pour ne pas écraser une correction manuelle.
    statut: hypothese
    si_faux: Si le dictionnaire doit aussi être rejoué sur l'historique, une recatégorisation manuelle sans règle serait écrasée au prochain replay.
    tests:
      - "R9 — replayAll laisse une transaction CARREFOUR recatégorisée à la main en other inchangée"
  - id: R10
    cas: [C2]
    enonce: >-
      L'aperçu d'auto-catégorisation applique le dictionnaire avant Claude : les transactions other reconnues deviennent des
      suggestions (confidence 1, source dictionary, reasoning « Marchand reconnu : <enseigne> », proposedRulePattern = motif de R15, donc fait des mots de l'enseigne reconnue) et ne sont
      pas envoyées à Claude ; si toutes le sont, Claude n'est pas appelé. totalOther et processed restent le nombre de transactions other du relevé.
    statut: sourcee
    source: "demande du lot : « appliqué en local avant Claude » ; flux actuel auto-categorize.service.ts:80-115 (toutes les other partent à Claude)"
    tests:
      - "R10 — avec une transaction CARREFOUR et une inconnue, Claude ne reçoit que l'inconnue"
      - "R10 — avec uniquement des enseignes connues, le client Claude n'est jamais appelé"
      - "R10 — la suggestion du dictionnaire porte confidence 1 et source dictionary"
      - "R10 — le motif proposé est celui des mots de l'enseigne, même quand elle n'est pas en tête de la clé (RETRAIT DAB 12/03 CARREFOUR → CARREFOUR, CB STATION E.LECLERC → LECLERC)"
  - id: R11
    cas: [C2]
    enonce: Le champ source (dictionary ou claude) est un ajout facultatif des suggestions ; une suggestion issue de Claude porte source claude et reste identique sinon.
    statut: hypothese
    si_faux: Si le client ne doit pas distinguer l'origine, le champ est ignoré sans effet ; l'ajout facultatif ne casse aucun appelant existant.
    tests:
      - "R11 — une suggestion issue de Claude porte source claude et les champs d'origine inchangés"
  - id: R12
    cas: [C2]
    enonce: En mode démo, l'aperçu reste refusé (403) avant tout passage dans le dictionnaire.
    statut: sourcee
    source: "auto-categorize.service.ts:76 (appel de assertNotDemo) et :221 (définition)"
    tests:
      - "R12 — en mode démo, l'aperçu répond 403 avec le message existant"
  - id: R13
    cas: [C3]
    enonce: >-
      Mémoriser un marchand n'écrase jamais une règle existante (CategoryRulesService.update n'est pas appelée ; sa sous-catégorie
      ni sa priorité ne sont touchées). Le service teste le libellé brut contre les règles existantes (même ordre que apply) :
      (a) si la règle qui gagne déjà donne la catégorie et la sous-catégorie choisies (sous-catégorie absente = vide), elle est
      réutilisée et rien n'est écrit ; (b) sinon une règle est créée (flags i, sous-catégorie du corps ou vide) de priorité
      max(100, 1 + plus haute priorité des règles qui reconnaissent le libellé brut), pour que ce dernier choix l'emporte. Dans
      les deux cas la règle est renvoyée dans createdRule.
    statut: hypothese
    si_faux: Si chaque coche doit créer une règle distincte au prix 100 (comme createRule), le choix mémorisé pourrait être masqué par une règle de priorité supérieure ; si l'on préfère modifier la règle existante, la sous-catégorie et la priorité de l'utilisateur seraient réécrites (décision du lead). Dans l'hypothèse retenue, aucune donnée existante n'est modifiée.
    tests:
      - "R13 — deux mémorisations identiques du même marchand ne laissent qu'une règle"
      - "R13 — une seconde mémorisation avec une autre catégorie crée une règle de priorité supérieure et laisse la première intacte"
      - "R13 — une règle utilisateur existante de priorité 200 sur le même libellé est dépassée (priorité 201) et reste inchangée, sous-catégorie comprise"
      - "R13 — la règle créée porte la sous-catégorie du corps, vide si absente"
  - id: R14
    cas: [C3]
    enonce: >-
      Si la clé de marchand est vide, la catégorie de la transaction est appliquée, aucune règle n'est créée, la réponse porte createdRule null
      et ruleSkipped « merchant-key-empty », et un log warn est écrit.
    statut: hypothese
    si_faux: Si une erreur 400 est préférée, la catégorie ne serait pas appliquée ; seul le statut change.
    tests:
      - "R14 — libellé « CB 1234 » : catégorie appliquée, aucune règle, ruleSkipped merchant-key-empty"
  - id: R15
    cas: [C2, C3]
    enonce: >-
      Motif de la règle mémorisée (amendé le 15-10 par le lead : l'ancien motif « deux premiers mots de la clé » attrapait des
      libellés sans rapport, p. ex. RETRAIT DAB 12/03 CARREFOUR donnait RETRAIT DAB). Les mots du motif sont (a) les mots de l'enseigne
      reconnue (l'entrée du dictionnaire qui a matché, R4), si le dictionnaire reconnaît le libellé ; (b) sinon tous les mots de la
      clé normalisée (R1). Chaque mot est littéral et borné (\b), les mots sont séparés par [^A-Za-z0-9]+, insensible à la casse :
      CARREFOUR donne \bCARREFOUR\b, RESTAURANT LE RECAMIER donne \bRESTAURANT[^A-Za-z0-9]+LE[^A-Za-z0-9]+RECAMIER\b. Un motif réduit
      à un seul mot de moins de 4 lettres n'est pas mémorisé : catégorie appliquée, createdRule null, ruleSkipped « pattern-too-short ».
      Le motif doit reconnaître le libellé brut (normalizedDescription, sinon description) de la transaction ; sinon (accents,
      chiffres intercalés) aucune règle n'est créée, createdRule est null et ruleSkipped vaut « pattern-no-match ». Les règles
      existantes continuent de s'appliquer sur normalizedDescription brut. L'aperçu d'auto-catégorisation (R10) propose le même motif
      pour une suggestion du dictionnaire. Le panneau Catégoriser du frontend affiche exactement les mots du motif, calculés par un
      miroir de la même fonction (frontend/src/lib/merchant-key.ts, parité testée) ; il ne promet rien d'autre. Le motif n'est pas
      conditionné au signe du montant (le dictionnaire, lui, ne s'applique qu'aux débits, R8).
    statut: sourcee
    source: "décision du lead du 15-10 (amende R15 après la troisième revue du lot) ; règles appliquées sur normalizedDescription brut : category-rules.service.ts:140 ; même garde « le motif doit correspondre à la transaction » : auto-categorize.service.ts:186-190 et sanitizeRulePattern"
    tests:
      - "R15 — enseigne reconnue : le motif est fait des mots de l'enseigne, pas des deux premiers mots de la clé"
      - "R15 — le motif d'une enseigne ne reconnaît pas un autre retrait au DAB"
      - "R15 — « PAIEMENT CB 1203 CARREFOUR MARKET 75015 » crée le motif des mots de l'enseigne, \\bCARREFOUR\\b"
      - "R15 — « RETRAIT DAB 12/03 CARREFOUR » crée CARREFOUR, qui ne reconnaît pas « RETRAIT DAB 03/04 BNP PARIBAS »"
      - "R15 — marchand inconnu : la clé entière, bornée ; « RESTAURANT LES PHILOSOPHES » n'est pas touché"
      - "R15 — le motif de « RESTAURANT LE RECAMIER » ne reconnaît ni « RESTAURANT LES PHILOSOPHES » ni « RESTAURANT LE COMPTOIR DU RELAIS »"
      - "R15 — « VIR SEPA M DUPONT LOYER » ne crée plus le motif SEPA M"
      - "R15 — un motif d'un seul mot de moins de 4 lettres n'est pas mémorisé (pattern-too-short)"
      - "R15 — un libellé dont le motif ne reconnaît pas le brut ne crée aucune règle (pattern-no-match)"
      - "R15 — le choix nomme les mots du motif (CB AMAZON.FR → « AMAZON FR »)"
      - "R15 — un libellé de plus de deux mots est nommé en entier, comme le motif créé (RESTAURANT LE RECAMIER)"
      - "R15 — enseigne reconnue hors de tête de libellé : seuls ses mots sont nommés (RETRAIT DAB 12/03 CARREFOUR → « CARREFOUR »)"
      - "R15 — motif d'un seul mot de moins de 4 lettres : mémorisation désactivée avec la raison, aucune règle envoyée"
      - "R15 — mots du motif absents tels quels du libellé brut (accent) : mémorisation désactivée"
      - "R15 — le motif et ses mots sont identiques côté backend et côté miroir frontend sur le même jeu de libellés (parité)"
  - id: R16
    cas: [C3]
    enonce: >-
      memorizeMerchant est un champ facultatif du corps. Absent, faux ou non booléen vrai, le comportement et la réponse actuels sont inchangés
      (createRule, rulePattern, replayAll). Si createRule est aussi vrai, le chemin createRule existant s'applique seul. replayAll est repris tel quel
      avec memorizeMerchant (il n'est pas implicite) ; le nombre de relevés modifiés est renvoyé dans replayed.
    statut: sourcee
    source: "contrat existant statements.controller.ts:174-226 (createRule, rulePattern, replayAll, réponse { transaction, createdRule, replayed })"
    tests:
      - "R16 — sans memorizeMerchant, la réponse et la règle créée sont identiques à l'existant"
      - "R16 — memorizeMerchant: \"true\" (chaîne) est traité comme absent : réponse existante, aucune règle"
      - "R16 — memorizeMerchant et createRule ensemble : une seule règle, celle de createRule"
      - "R16 — memorizeMerchant avec replayAll rejoue la règle sur les autres relevés"
  - id: R17
    cas: [C3]
    enonce: >-
      Les validations existantes passent avant toute mémorisation : category requis, catégorie invalide (slug), relevé introuvable, transaction
      introuvable ; en erreur, ni la transaction ni les règles ne sont modifiées.
    statut: sourcee
    source: "statements.controller.ts:187-196"
    tests:
      - "R17 — catégorie invalide avec memorizeMerchant : 400 et aucune règle créée"
      - "R17 — transaction introuvable avec memorizeMerchant : 404 et aucune règle créée"
  - id: R18
    cas: [C1, C2, C3]
    enonce: >-
      Découpage en mots : après mise en majuscules et retrait des accents, tout caractère hors A-Z et 0-9 est un séparateur
      (espace, « . », « * », « - », « ' », « / »…) ; les mots sont les suites non vides de lettres et chiffres. « E.LECLERC »
      donne E, LECLERC ; « UBER *TRIP » et « UBER*TRIP » donnent UBER, TRIP ; « PAYPAL *NETFLIX » donne PAYPAL, NETFLIX. La
      reconnaissance d'une enseigne (R4), les préfixes (R2) et le motif de marchand (R15) reposent tous sur ce même découpage.
    statut: hypothese
    si_faux: Si « E.LECLERC » ou « UBER*TRIP » devaient rester un seul mot, ces libellés courants ne seraient pas reconnus ; seul le découpage change, aucune donnée en jeu.
    tests:
      - "R18 — « E.LECLERC PARIS » est reconnu comme Leclerc (food)"
      - "R18 — « UBER *TRIP » et « UBER*TRIP » sont reconnus comme Uber (transport)"
      - "R18 — « PAYPAL *NETFLIX » est reconnu comme Netflix (subscriptions)"
      - "R18 — un libellé accentué « CARREFOUR CITÉ » est découpé sans l'accent"
  - id: R19
    cas: [C1]
    enonce: >-
      CategoryRulesService reçoit une méthode applyWithHits(transactions) qui renvoie { transactions, matchedIds } : matchedIds
      contient l'id de chaque transaction reconnue par au moins une règle, même si la catégorie obtenue est identique à
      l'ancienne ou vaut other. apply() garde sa signature et son résultat à l'identique (elle délègue à applyWithHits) ;
      sans règle, matchedIds est vide. Le dictionnaire ne s'applique pas aux transactions de matchedIds.
    statut: hypothese
    si_faux: Si la signature de apply() devait changer, ses autres appelants (replayAll, import) seraient à adapter ; avec une méthode ajoutée, rien d'existant ne bouge et aucune donnée n'est en jeu.
    tests:
      - "R19 — une règle qui donne la catégorie déjà portée par Claude marque quand même la transaction dans matchedIds"
      - "R19 — une règle vers other marque la transaction dans matchedIds"
      - "R19 — sans aucune règle, matchedIds est vide et les transactions sont inchangées"
      - "R19 — apply() renvoie le même résultat qu'avant pour les mêmes entrées"

contrats:
  - id: A1
    appel: PATCH /api/statements/:id/transactions/:txId/category
    entree: "corps { category, subcategory?, createRule?, rulePattern?, replayAll?, memorizeMerchant? } — memorizeMerchant est le seul ajout, facultatif"
    sortie: "HTTP 200 { transaction, createdRule, replayed } ; ajout facultatif ruleSkipped (« merchant-key-empty », « pattern-too-short » ou « pattern-no-match ») présent seulement quand memorizeMerchant n'a pas créé de règle"
    erreurs:
      - { code: HTTP 400, message: "category requis" }
      - { code: HTTP 400, message: "Catégorie invalide : <category>" }
      - { code: HTTP 404, message: "Relevé <id> introuvable" }
      - { code: HTTP 404, message: "Transaction <txId> introuvable" }
      - { code: log warn, message: "Merchant rule not created for transaction <txId>: <ruleSkipped>" }
    regles: [R1, R2, R4, R13, R14, R15, R16, R17, R18]
  - id: A2
    appel: POST /api/auto-categorize/:statementId/preview
    entree: "identifiant du relevé dans le chemin ; aucun corps"
    sortie: "HTTP 200 aperçu existant ; suggestions[] avec le champ facultatif source (dictionary | claude)"
    erreurs:
      - { code: HTTP 403, message: "L'auto-catégorisation Claude n'est pas disponible en mode démo (consomme des tokens API)." }
      - { code: HTTP 404, message: "Relevé <statementId> introuvable" }
    regles: [R1, R3, R4, R5, R8, R10, R11, R12, R15, R18]
  - id: A3
    appel: POST /api/statements/upload
    entree: "PDF(s) inchangés ; POST /api/statements/:id/reanalyze suit le même passage dictionnaire"
    sortie: "réponse inchangée ; seules les catégories des transactions reconnues diffèrent, plus un log de version"
    erreurs: []
    sans_erreur: "le passage dictionnaire est une fonction pure sans source externe ni entrée utilisateur ; il n'ajoute aucun code d'erreur, les erreurs de l'upload et de Claude restent celles de l'existant (la notion d'échec du dictionnaire n'existe pas)"
    regles: [R1, R3, R4, R5, R6, R7, R8, R9, R18, R19]

donnees:
  - { id: D1, objet: "dictionnaire de marchands (constante du code + numéro de version, backend/src/modules/category-rules)", existant: false, modification: aucune, note: "nouveau, livré avec le code, aucun stockage ni migration" }
  - { id: D2, objet: "data/category-rules.json (liste de CategoryRule)", existant: true, modification: aucune, note: "format inchangé ; les règles « marchand » sont des CategoryRule ordinaires ajoutées par create() ; aucune règle existante n'est modifiée ni supprimée (R13)" }
