name: Build & push to GHCR

# Pipeline CI adapté du modèle maritime-atlas (build-and-push.yml).
# Push sur main → détecte quel(s) service(s) (backend/frontend) ont changé
# → docker build + push ghcr.io/sylad/finance-tracker-<service>:sha-<shortsha> + :latest.
# Déploiement : bump du tag dans developpeur-gitops/charts/finance-tracker/values.yaml
# → ArgoCD sync (cluster k3s dark-blue).

on:
  push:
    # Pas de filtre `paths` : chaque push de main a son run (vide si ni
    # backend/ ni frontend/ n'ont changé), sinon `cadence deliver` attend en
    # vain la CI d'un sha qui ne touche que la doc ou le plan.
    branches: [main]
  workflow_dispatch:
    inputs:
      service:
        description: 'Service à rebuild (backend/frontend, vide = auto-detect par diff)'
        required: false
        type: string

permissions:
  contents: read
  packages: write   # push ghcr.io/sylad/* — packages créés par la CI, auto-liés au repo

jobs:
  detect-changes:
    name: Detect changed services
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.set-matrix.outputs.services }}
    steps:
      - uses: actions/checkout@v4
        with:
          # 0 = tout l'historique : nécessaire pour diff la plage COMPLÈTE d'un
          # push multi-commits (before..after), pas juste le dernier commit.
          fetch-depth: 0

      - name: Set matrix from changes
        id: set-matrix
        run: |
          if [ -n "${{ inputs.service }}" ]; then
            echo "services=[\"${{ inputs.service }}\"]" >> $GITHUB_OUTPUT
            exit 0
          fi
          # Diff la plage complète du push (before..after), fallback HEAD~1
          # pour premier commit / force-push (leçon maritime 2026-06-18).
          BEFORE="${{ github.event.before }}"
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BEFORE" 2>/dev/null; then
            BEFORE="$(git rev-parse HEAD~1 2>/dev/null || git rev-parse HEAD)"
          fi
          CHANGED=$(git diff --name-only "$BEFORE" "${{ github.sha }}")
          MATRIX=()
          echo "$CHANGED" | grep -q "^backend/"  && MATRIX+=("\"backend\"")
          echo "$CHANGED" | grep -q "^frontend/" && MATRIX+=("\"frontend\"")
          # Modif du workflow lui-même → rebuild des 2 services
          if echo "$CHANGED" | grep -q "^.github/workflows/build.yml"; then
            MATRIX=("\"backend\"" "\"frontend\"")
          fi
          if [ ${#MATRIX[@]} -eq 0 ]; then
            echo "services=[]" >> $GITHUB_OUTPUT
          else
            JOINED=$(IFS=,; echo "${MATRIX[*]}")
            echo "services=[$JOINED]" >> $GITHUB_OUTPUT
          fi

  build-push:
    name: Build & push ${{ matrix.service }}
    needs: [detect-changes]
    if: ${{ needs.detect-changes.outputs.services != '[]' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJson(needs.detect-changes.outputs.services) }}
    steps:
      - uses: actions/checkout@v4

      # L53 — pas d'image backend sur une suite Jest rouge : les trois étapes
      # ci-dessous ne tournent que pour le service backend et précèdent le
      # build. Un test rouge rend le job « Build & push backend » rouge, rien
      # n'est poussé sur GHCR, et scripts/deploy.sh bloque la livraison du
      # backend comme pour tout build rouge (le frontend n'est pas retenu :
      # fail-fast: false). Étapes DANS ce job, pas un job à part en `needs` :
      # un job de build sauté (skipped) n'est pas un build rouge pour
      # deploy.sh, et le frontend aurait attendu les tests du backend.
      # Mêmes commandes que backend-checks.yml (qui, lui, tourne à chaque
      # push) ; node_modules est écarté du contexte Docker par .dockerignore.
      - name: Node (tests backend)
        if: matrix.service == 'backend'
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Dépendances (tests backend)
        if: matrix.service == 'backend'
        working-directory: backend
        run: npm ci --no-audit --no-fund

      - name: Tests Jest backend (rouge = pas d'image)
        if: matrix.service == 'backend'
        working-directory: backend
        run: npm test

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # GITHUB_TOKEN suffit ICI : les packages finance-tracker-* sont créés par la CI
          # elle-même au premier push → auto-liés au repo avec droit write.
          # (Le 403 vécu sur maritime concernait des packages pré-créés via PAT
          # local — si ce cas réapparaît : repo secret GHCR_TOKEN, cf memory
          # github_actions_ghcr_user_packages_403.)
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image name & tags
        id: meta
        run: |
          SHA_SHORT=$(echo "${{ github.sha }}" | cut -c1-7)
          # lowercase obligatoire pour GHCR (owner = Sylad → sylad)
          IMAGE="ghcr.io/sylad/finance-tracker-${{ matrix.service }}"
          echo "image=$IMAGE" >> $GITHUB_OUTPUT
          echo "tags=$IMAGE:sha-$SHA_SHORT,$IMAGE:latest" >> $GITHUB_OUTPUT
          echo "sha-tag=sha-$SHA_SHORT" >> $GITHUB_OUTPUT

      - name: Build & push
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.service }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/Sylad/finance-tracker
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,scope=${{ matrix.service }},mode=max

      - name: Summary
        run: |
          echo "Pushed: ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.sha-tag }} (+ :latest)"
          echo "Deploy : bump tag dans developpeur-gitops/charts/finance-tracker/values.yaml → commit+push → ArgoCD sync"
