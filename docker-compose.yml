name: finance-tracker

# Lancement en conteneurs générique (README « Setup local »). Sur Big-Blue,
# l'instance aux vraies données passe par local/run.sh (ou
# docker-compose.local.yml) ; la prod démo tourne sur le k3s de dark-blue,
# déployée par `cadence deliver`.

services:
  finance-backend:
    build:
      context: ./backend
    ports:
      - "3000:3000"
    env_file: ./backend/.env
    environment:
      NODE_ENV: production
      CORS_ORIGIN: "http://localhost:4200"
      DATA_DIR: /app/data
      UPLOAD_DIR: /app/data/uploads
      # Hosts (virgules ; nom exact ou sous-domaine, jamais sous-chaîne) automatiquement verrouillés
      # en mode démo + bypass PIN. Idéal pour tunnels Cloudflare publics.
      # Ajoute ton domaine perso si besoin (ex: demo.tonsite.fr).
      DEMO_FORCED_HOSTS: "trycloudflare.com,cfargotunnel.com,finance.sladoire.dev"
    volumes:
      - ./data:/app/data
    restart: unless-stopped

  finance-frontend:
    build:
      context: ./frontend
    ports:
      - "4200:80"
    depends_on:
      - finance-backend
    restart: unless-stopped
