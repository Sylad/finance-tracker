# Finance-tracker LOCAL Big-Blue — la SEULE instance avec les vraies données
# bancaires (décision 2026-09-08 : dark-blue = vitrine démo publique).
# Données : ./data-local/ (gitignoré, backup chiffré → NAS backups/).
#
# Lancer :  docker compose -f docker-compose.local.yml up -d --build
# Arrêter : docker compose -f docker-compose.local.yml down
# Accès :   http://localhost:4200 (PIN habituel)
services:
  finance-backend:
    build: ./backend
    env_file: backend/.env
    environment:
      NODE_ENV: production
      PORT: "3000"
      DATA_DIR: /app/data
      UPLOAD_DIR: /app/data/uploads
      CORS_ORIGIN: http://localhost:4200
      # Ollama du PC (RTX 5090) pour santé financière + détection crédits
      OLLAMA_ADVICE_BASE_URL: http://host.docker.internal:11434
      OLLAMA_DETECTION_BASE_URL: http://host.docker.internal:11434
    volumes:
      - ./data-local:/app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  finance-frontend:
    build: ./frontend
    ports:
      - "4200:80"
    depends_on:
      - finance-backend
    restart: unless-stopped
