# Fichiers dérivés du plan : un commit qui ne touche que le plan et ceux-ci est de
# l'entretien du plan (pas de lot à citer, ne compte pour aucun lot).
plan:
  files: [frontend/public/plan-data/plan.json]
  # Plan publié régénéré à chaque écriture du plan (plan.onWrite) : un raf ux/done du lead le laissait en retard
  # et la CI « Plan publié à jour » refusait la livraison (vu sur warhammer40k L200, 27-10).
  onWrite: { command: npm run plan, files: [frontend/public/plan-data/plan.json] }
# Livraison par `cadence deliver` (https://github.com/Sylad/cadence) :
# CI du sha poussé → bump du tag dans developpeur-gitops → vérification de l'effet.
deliver:
  ci: github
  deploy:
    - ./scripts/deploy.sh
  verify:
    - command: ./scripts/verify-rollout.sh
    - url: https://finance.sladoire.dev/api/health
      contains: '"status":"ok"'
    - url: https://finance.sladoire.dev/
    # Politique de cache vue à travers Cloudflare : document en no-cache,
    # actif absent en 404 (sonde à query string unique), actif à empreinte en
    # cache long, sw.js en no-cache.
    - command: ./scripts/verify-cache.sh
  verifyTimeout: 600

# Revue UX automatique des vagues (cadence orchestrate, L60) : démo locale ISOLÉE —
# backend NestJS (3052) + frontend Vite (5192), ports distincts d'ol-companion et de
# l'instance réelle (3000/4200), DEMO_FORCED=true, APP_PIN et clé Anthropic vides,
# DATA_DIR jetable hors data-local/ rempli depuis les fixtures versionnées. Un seul
# groupe de processus, tué ensemble par le programme. Preuve : ux-demo.spec.ts.
orchestrate:
  # Un test de la porte lit le plan (plan publié / page Plan) : verify --gate rejoue sous des commits de plan seuls (cadence L450, 30-10).
  gate: { readsPlan: true }
  # Escalade (L154, cadence L337 / 1.12.0) : avant de rendre un lot encore non conforme après ses passes, la vague joue
  # une correction et une revue neuve en Fable (règle du lead depuis le 17-10, oubliée deux fois à la main).
  escalation: { model: fable }
  # Précheck coupé le 28-10 (L160) : cadence perf du 22 au 28-10 = 1 « oui » sur 236 lots, 4,9 M tokens Sonnet
  # pour ≈ 80 k évités ; des lots bien découpés n'ont plus rien à retrouver. Revenir à true si une vague refait un lot déjà fait.
  precheck: false
  # Porte de tests de la vague (L153), lancée après chaque implement/fix : la CI « Contrôles frontend » a été rouge
  # le 21-10 faute que la vague lance la suite. Commandes vérifiées vertes sur main le 25-10 : backend Jest
  # 1300 tests (71 suites), frontend Vitest 748 tests (79 fichiers). Aucun test e2e ni lent à exclure aujourd'hui
  # (le `test:e2e` du backend est un script à part, hors `npm test`) ; si l'un expire sous la charge de la suite
  # complète, l'exclure ici avec `--exclude` et le dire dans ce commentaire. Les acceptations rouges (vert: false)
  # ne vont jamais dans cette commande.
  test: (cd backend && npm test) && (cd frontend && npx vitest run)
  # Build backend (nest build) puis frontend (tsc -b + vite build + contrôle de fuite du plan), verts le 25-10.
  # Ne touche ni data-local/ ni aux vraies données.
  build: (cd backend && npm run build) && (cd frontend && npm run build)
  ux:
    command: ./local/ux-demo.sh
    url: http://localhost:5192
    timeout: 300

# Documentation qui suit le code (cadence docs.sync, L307 de cadence, 24-10) : raf check et la revue signalent un lot dont le code laisse sa doc en retard ; docs.articles = étude de cas du projet dans claude-code-codex (le bibliothécaire propose un lot là-bas).
docs:
  sync:
    # API NestJS (modules, models, config, guards) : « Fonctionnalités » / « Stack » du README et « Architecture / Conventions / Pièges » du CLAUDE.md.
    - paths: ['backend/src/**', '!**/*.test.*', '!**/*.spec.*', '!**/__snapshots__/**']
      docs: [README.md, CLAUDE.md]
    # Écrans React (routes, composants, router) : « Fonctionnalités » du README, CLAUDE.md ; une Nouveauté vaut pour un changement visible.
    - paths: ['frontend/src/**', '!**/*.css', '!frontend/src/test/**', '!**/*.test.*', '!**/*.spec.*', '!**/__snapshots__/**']
      docs: [README.md, CLAUDE.md, 'docs/nouveautes/*.md']
  since: 2026-10-24
  articles:
    - repo: ../claude-code-codex
      file: frontend/src/pages/case-studies/finance-tracker.astro
