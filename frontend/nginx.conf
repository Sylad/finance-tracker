# Cache des fichiers statiques — testé sur un vrai nginx par
# scripts/test-nginx-cache.sh, vérifié en prod par scripts/verify-cache.sh.
#
# Cache-Control des fichiers de /assets/ selon le statut de la réponse : un
# an pour un fichier servi (son nom porte l'empreinte de son contenu, il ne
# change jamais), rien du tout pour une erreur — sans consigne, Cloudflare
# garderait 3 minutes le 404 d'un fichier qu'un pod pas encore à jour ne
# connaît pas.
map $status $assets_cache_control {
    default            "no-store";
    ~^(200|206|304)$   "public, max-age=31536000, immutable";
}

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 100M;

    location /api/events {
        proxy_pass http://finance-backend:3000/api/events;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 24h;
        chunked_transfer_encoding off;
    }

    location /api/ {
        proxy_pass http://finance-backend:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Long timeouts for /api/statements/upload which processes
        # multiple PDFs sequentially (~60-90s each, up to 12 PDFs).
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
        client_max_body_size 100M;
    }

    # Sorties de Vite, toutes à empreinte (<nom>-<hash>.<ext>). Un fichier
    # absent répond 404, JAMAIS le repli index.html : un navigateur resté sur
    # un ancien index.html demande un ancien chunk, et lui répondre du HTML
    # en 200 sous un nom en .js casse la page (et Cloudflare le mettait en
    # cache).
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control $assets_cache_control always;
    }

    # Tout le reste : index.html (demandé tel quel, par « / » ou en repli
    # d'une route de la SPA) et les fichiers sans empreinte du build — sw.js,
    # manifest, icônes, nouveautes-data/, plan-data/. Ils changent d'une
    # livraison à l'autre sous le même nom : no-cache = gardés mais revalidés
    # à chaque usage (ETag / Last-Modified → 304), donc jamais plus vieux que
    # l'appli. Sans cet en-tête, le navigateur gardait l'ancien index.html
    # par fraîcheur heuristique après une livraison.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
